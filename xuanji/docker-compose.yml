services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xuanji
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app          # sync host code into container
      - /app/migrations         # preserve migrations generated inside container

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    env_file: ./frontend/.env.local
    command: npm run dev
    depends_on: [backend]
    volumes:
      - ./frontend:/app         # sync host code into container
      - /app/node_modules       # preserve node_modules installed in image
      - /app/.next              # preserve build cache

volumes:
  pgdata: